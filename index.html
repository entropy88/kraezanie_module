<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibTeX → DOCX</title>

  <script src="https://unpkg.com/docx@9.0.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 550px;
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>BibTeX → DOCX</h1>

  <label>Тема на справката</label>
<input
  type="text"
  id="reportTopic"
  placeholder="Въведете тема..."
/>

  <label>Изберете Bibtex файл</label>
  <input type="file" id="bibfile" accept=".bib,.bibtex" />

  <label>Именовай файл</label>
  <input
    type="text"
    id="filename"
    value="sorted_shelf"
  />

  <button id="generateBtn">Генерирай DOCX</button>

  <div id="status"></div>
</div>

<script src="app.js"></script>

</body>
</html>
